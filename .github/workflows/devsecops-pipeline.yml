name: DevSecOps Pipeline

on:
  push:
    branches:
      - 'workshop-2-sast-sca'
      - 'workshop-2/**'
  pull_request:
    branches:
      - 'workshop-2-sast-sca'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  sast-sca-semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pipx
        run: sudo apt-get update && sudo apt-get install -y pipx

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Add pipx bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Semgrep scan
        run: semgrep --config p/owasp-top-ten --json-output=semgrep-results.json --sarif-output=semgrep-results.sarif .

      - name: Verify report exists
        run: test -f semgrep-results.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: |
            semgrep-results.json
            semgrep-results.sarif

  sca-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Dependency-Check database cache
        id: dc-cache
        uses: actions/cache@v6
        with:
          path: .dc-data
          key: dependency-check-nvd-${{ github.run_id }}
          restore-keys: |
            dependency-check-nvd-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            KEYARG="--nvdApiKey $NVD_API_KEY"
          else
            KEYARG=""
          fi
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:ro" -v "$PWD/reports:/out" -v "$PWD/.dc-data:/usr/share/dependency-check/data" owasp/dependency-check:latest --project juice-shop-workshop2 --scan /src --out /out --format HTML --format JSON $KEYARG

      - name: Verify report exists
        run: test -f reports/dependency-check-report.json

      - name: Upload SCA report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: reports/
