name: DevSecOps Pipeline

on:
  push:
    branches:
      - 'workshop-2-sast-sca'
      - 'workshop-2/**'
  pull_request:
    branches:
      - 'workshop-2-sast-sca'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
